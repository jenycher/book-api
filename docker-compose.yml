services:
  mongo:
    image: mongo:latest
    restart: always
    container_name: library-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
      MONGO_INITDB_DATABASE: library_db
    volumes:
      - mongo_data:/data/db
    networks:
      - library-network

  mongo-express:
    image: mongo-express:latest
    restart: always
    container_name: library-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: secretpassword
      ME_CONFIG_MONGODB_URL: mongodb://admin:secretpassword@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: mongoexpressuser
      ME_CONFIG_BASICAUTH_PASSWORD: mongoexpresspass
    depends_on:
      - mongo
    networks:
      - library-network

  book-api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - COUNTER_SERVICE_URL=http://counter-api:3001
    depends_on:
      - counter-api
      - mongo
    networks:
      - library-network
    volumes:
      - ./public/uploads:/app/public/uploads

  counter-api:
    build: ./counter-api
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATA_DIR=/app/data
    volumes:
      - ./counter-api/data:/app/data
    networks:
      - library-network

volumes:
  mongo_data:
    driver: local

networks:
  library-network:
    driver: bridge